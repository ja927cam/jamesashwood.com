# jamesashwood.com — Nginx server block
# Install to /etc/nginx/sites-available/jamesashwood.com and symlink into sites-enabled.
# Then run: sudo certbot --nginx -d jamesashwood.com -d www.jamesashwood.com

server {
    listen 80;
    listen [::]:80;
    server_name jamesashwood.com www.jamesashwood.com;

    root /var/www/jamesashwood.com;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # HTML: always revalidate so content edits appear immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprint or rename these if you ever need long-lived immutable caching.
    location ~* \.(css|js|svg|png|jpe?g|webp|avif|pdf|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    location = /robots.txt {
        default_type text/plain;
    }

    location = /sitemap.xml {
        default_type application/xml;
    }
}
